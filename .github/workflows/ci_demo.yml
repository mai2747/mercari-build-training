name: CI Demo
run-name: ${{ github.actor }} is testing out GitHub Actions / CI
on:
    pull_request:
        branches: [ '**' ] #[ 'mai2747_test' ]
        paths: [ '**' ]  # 他のファイルも対象にするべき？ -> 一旦このまま -> 前ファイル対象でテスト
jobs:
  # ダミーコメントを投稿するjobを設定する、とりあえず動くところを見てから進みたい
  post_comment:
    runs-on: dev
    steps:
      - name: Post an automated comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "This is an automatic comment :))"
            })